<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作日志</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin:0; background: var(--magpie-bg, Canvas); color: var(--magpie-fg, CanvasText);
    font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    -webkit-font-smoothing: antialiased; }
  body { padding: 18px 22px 26px; max-width: 1060px; margin: 0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .chip { font-size:11px; color:var(--magpie-muted, GrayText); border:1px solid var(--magpie-line, ButtonBorder); border-radius:999px; padding:1px 9px; }
  .spacer { flex:1; }
  button { font:inherit; color:inherit; background:var(--magpie-card, ButtonFace); border:1px solid var(--magpie-line, ButtonBorder); border-radius:6px; padding:4px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--magpie-muted, ButtonBorder); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--magpie-accent-soft, Highlight); border-color:transparent; color:var(--magpie-accent, HighlightText); font-weight:500; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  select, input[type=text] { font:inherit; color:inherit; background:var(--magpie-card, ButtonFace);
    border:1px solid var(--magpie-line, ButtonBorder); border-radius:6px; padding:3px 8px; max-width:220px; }
  .mtable { width:100%; border-collapse:collapse; margin-bottom:14px; font-size:12px; }
  .mtable th, .mtable td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--magpie-line, ButtonBorder); }
  .mtable th { color:var(--magpie-muted, GrayText); font-weight:500; }
  .mtable .num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { display:inline-block; height:8px; border-radius:99px; background:var(--magpie-accent, Highlight); vertical-align:middle; min-width:2px; }
  .timeline { display:flex; flex-direction:column; gap:6px; }
  .ev { display:flex; gap:10px; align-items:baseline; background:var(--magpie-card, Canvas);
    border:1px solid var(--magpie-line, ButtonBorder); border-radius:8px; padding:7px 11px; }
  .ev .model { flex:none; font-size:10px; font-weight:600; padding:1px 7px; border-radius:99px; background:var(--magpie-accent-soft, Highlight); color:var(--magpie-accent, HighlightText); max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ev.user .body { font-weight:500; }
  .ev .meta { flex:none; font-size:11px; color:var(--magpie-muted, GrayText); min-width:118px; }
  .ev .body { word-break:break-all; }
  h2 { font-size:13px; font-weight:600; margin:18px 0 8px; }
  pre { background:var(--magpie-card, Canvas); border:1px solid var(--magpie-line, ButtonBorder); border-radius:8px;
    padding:10px 12px; overflow:auto; max-height:320px; font:11px/1.55 var(--magpie-code, ui-monospace, Menlo, monospace);
    white-space:pre-wrap; word-break:break-all; color:var(--magpie-muted, GrayText); }
  .stat { font-size:11px; color:var(--magpie-muted, GrayText); }
  .genbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0 12px; }
  .spin { display:inline-block; width:11px; height:11px; border:2px solid var(--magpie-line, ButtonBorder);
    border-top-color:var(--magpie-accent, Highlight); border-radius:99px; animation:sp .7s linear infinite; vertical-align:-1px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--magpie-card, ButtonFace);
    border:1px solid var(--magpie-line, ButtonBorder); border-radius:8px; padding:7px 14px; font-size:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.18); display:none; max-width:80vw; word-break:break-all; z-index:9; }
</style>
</head>
<body>
<header>
  <h1>📋 工作日志</h1>
  <span class="chip" id="dbstat">…</span>
  <span class="spacer"></span>
</header>

<h2>模型用量（magpie 引擎库直查）</h2>
<table class="mtable" id="mtable"></table>

<div class="toolbar">
  <select id="f-days">
    <option value="1">今天</option>
    <option value="3">近 3 天</option>
    <option value="7" selected>近 7 天</option>
    <option value="14">近 14 天</option>
    <option value="30">近 30 天</option>
  </select>
  <select id="f-model"><option value="">全部模型</option></select>
  <input type="text" id="f-q" placeholder="搜索关键词…" style="width:170px">
  <button id="refresh">🔍 筛选</button>
  <span class="stat" id="count"></span>
</div>
<div class="timeline" id="timeline"></div>

<h2>周报生成</h2>
<div class="genbar">
  <label>agent 工具 <select id="g-runner"></select></label>
  <label>模型 <select id="g-model"></select></label>
  <label>范围 <select id="g-days">
    <option value="7" selected>近 7 天</option>
    <option value="14">近 14 天</option>
    <option value="30">近 30 天</option>
  </select></label>
  <label class="stat">只筛模型 <select id="g-filter"><option value="">全部</option></select></label>
  <button class="primary" id="g-gen">✨ 生成周报</button>
  <button id="g-ctx">👀 看上下文</button>
  <span class="stat" id="g-note"></span>
</div>
<pre id="report"></pre>
<div id="toast"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  function toast(msg, ms = 4200) {
    const el = $("toast");
    el.textContent = msg; el.style.display = "block";
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.style.display = "none"), ms);
  }
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "content-type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await res.json().catch(() => ({ error: "HTTP " + res.status }));
    if (!res.ok) throw new Error(j.error || "HTTP " + res.status);
    return j;
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  try {
    const q = new URLSearchParams(location.search);
    const t = q.get("tokens");
    if (t) {
      const slim = JSON.parse(decodeURIComponent(escape(atob(t))));
      for (const [k, v] of Object.entries(slim || {}))
        document.documentElement.style.setProperty("--magpie-" + k, v);
    }
    if (q.get("theme")) document.documentElement.style.colorScheme = q.get("theme");
  } catch { }

  function syncModelFilter(models) {
    for (const sel of [$("f-model"), $("g-filter")]) {
      const cur = sel.value;
      sel.innerHTML = '<option value="">全部模型</option>';
      for (const m of models) {
        const o = document.createElement("option");
        o.value = m.model;
        o.textContent = `${m.model} (${m.msgs})`;
        sel.appendChild(o);
      }
      if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
    }
  }

  async function loadModels() {
    const days = $("f-days").value;
    const r = await api("GET", "/api/models?days=" + days);
    const max = Math.max(1, ...r.models.map((m) => m.msgs));
    syncModelFilter(r.models);
    $("mtable").innerHTML = `<tr><th>模型</th><th>provider</th><th class="num">消息数</th><th class="num">会话数</th><th></th></tr>` +
      r.models.map((m) => `<tr><td>${esc(m.model)}</td><td>${esc(m.provider)}</td>
        <td class="num">${m.msgs}</td><td class="num">${m.sessions}</td>
        <td><span class="bar" style="width:${Math.round(m.msgs / max * 140)}px"></span></td></tr>`).join("") ||
      '<tr><td colspan="5" class="stat">（该时段无消息）</td></tr>';
  }

  async function loadEvents() {
    const days = $("f-days").value;
    const model = $("f-model").value;
    const q = $("f-q").value;
    const qs = new URLSearchParams({ days, limit: "300" });
    if (model) qs.set("model", model);
    if (q) qs.set("q", q);
    const r = await api("GET", "/api/events?" + qs);
    $("count").textContent = `${r.events.length} 条`;
    const html = [];
    let lastDay = "";
    for (const e of r.events) {
      const d = e.at.slice(0, 10);
      if (d !== lastDay) { lastDay = d; html.push(`<h2>${d}</h2>`); }
      html.push(`<div class="ev ${e.role}"><span class="model">${esc(e.model || e.role)}</span>
        <span class="meta">${e.at.slice(11, 16)} ${e.role === "user" ? "→" : "←"} ${esc((e.project || "").split("/").slice(-1)[0])}</span>
        <span class="body">${esc(e.text.slice(0, 220))}</span></div>`);
    }
    $("timeline").innerHTML = html.join("") || '<div class="stat">无记录</div>';
  }

  async function loadRunners() {
    const rs = await api("GET", "/api/runners");
    const sel = $("g-runner");
    sel.innerHTML = "";
    for (const [k, r] of Object.entries(rs)) {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = r.label + (r.available ? "" : "（未安装）");
      if (!r.available) o.disabled = true;
      sel.appendChild(o);
    }
    sel.value = "local";
    sel.onchange = syncModels;
    syncModels();
    function syncModels() {
      const r = rs[sel.value];
      const m = $("g-model");
      m.innerHTML = "";
      for (const x of r?.models || ["—"]) {
        const o = document.createElement("option");
        o.value = x; o.textContent = x;
        m.appendChild(o);
      }
    }
  }

  $("refresh").onclick = async () => {
    try { await loadModels(); await loadEvents(); }
    catch (e) { toast("加载失败: " + e.message); }
  };
  $("f-days").onchange = () => $("refresh").click();
  $("g-ctx").onclick = async () => {
    const r = await api("POST", "/api/context-preview", {
      days: Number($("g-days").value), model: $("g-filter").value || undefined,
    }).catch((e) => ({ error: e.message }));
    $("report").textContent = r.error ? "错误: " + r.error : `（${r.count} 条事件 · 约 ${r.tokens} tokens）\n\n` + r.text;
  };
  $("g-gen").onclick = async () => {
    const b = $("g-gen");
    b.disabled = true; b.innerHTML = '<span class="spin"></span> 生成中…';
    $("g-note").textContent = "";
    try {
      const r = await api("POST", "/api/generate", {
        days: Number($("g-days").value),
        runner: $("g-runner").value,
        model: $("g-model").value.startsWith("默认") ? undefined : $("g-model").value,
        filterModel: $("g-filter").value || undefined,
      });
      if (r.ok) {
        $("report").textContent = r.text;
        $("g-note").textContent = `已存 ${(r.file || "").split("/").pop()} · ${r.events} 事件`;
      } else $("report").textContent = "生成失败: " + (r.error || "?");
    } catch (e) { toast("生成失败: " + e.message, 6000); }
    finally { b.disabled = false; b.textContent = "✨ 生成周报"; }
  };

  (async () => {
    const h = await api("GET", "/api/health").catch(() => null);
    if (h) $("dbstat").textContent = h.ok ? "opencode.db 直连" : "库不可用: " + (h.error || "");
    await loadRunners().catch(() => { });
    await loadModels().catch((e) => toast("模型用量加载失败: " + e.message));
    await loadEvents().catch((e) => toast("时间线加载失败: " + e.message));
  })();
})();
</script>
</body>
</html>
