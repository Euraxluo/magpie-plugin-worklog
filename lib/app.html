<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作日志</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin:0; background: var(--magpie-bg, Canvas); color: var(--magpie-fg, CanvasText);
    font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    -webkit-font-smoothing: antialiased; }
  body { padding: 18px 22px 26px; max-width: 1060px; margin: 0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .chip { font-size:11px; color:var(--magpie-muted, GrayText); border:1px solid var(--magpie-line, ButtonBorder); border-radius:999px; padding:1px 9px; }
  .spacer { flex:1; }
  button { font:inherit; color:inherit; background:var(--magpie-card, ButtonFace); border:1px solid var(--magpie-line, ButtonBorder); border-radius:6px; padding:4px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--magpie-muted, ButtonBorder); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--magpie-accent-soft, Highlight); border-color:transparent; color:var(--magpie-accent, HighlightText); font-weight:500; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  select, input[type=text], input[type=number] { font:inherit; color:inherit; background:var(--magpie-card, ButtonFace);
    border:1px solid var(--magpie-line, ButtonBorder); border-radius:6px; padding:3px 8px; }
  .timeline { display:flex; flex-direction:column; gap:6px; }
  .ev { display:flex; gap:10px; align-items:baseline; background:var(--magpie-card, Canvas);
    border:1px solid var(--magpie-line, ButtonBorder); border-radius:8px; padding:7px 11px; }
  .ev .src { flex:none; font-size:10px; font-weight:600; padding:1px 7px; border-radius:99px; color:#fff; }
  .src.claude { background:#d97757; } .src.codex { background:#4f6ef7; } .src.omp { background:#2f9e6e; } .src.git { background:#6b7280; }
  .ev.prompt .body { font-weight:500; }
  .ev .meta { flex:none; font-size:11px; color:var(--magpie-muted, GrayText); min-width:118px; }
  .ev .body { word-break:break-all; }
  h2 { font-size:13px; font-weight:600; margin:18px 0 8px; }
  pre { background:var(--magpie-card, Canvas); border:1px solid var(--magpie-line, ButtonBorder); border-radius:8px;
    padding:10px 12px; overflow:auto; max-height:300px; font:11px/1.55 var(--magpie-code, ui-monospace, Menlo, monospace);
    white-space:pre-wrap; word-break:break-all; color:var(--magpie-muted, GrayText); }
  #report { max-height:none; }
  .stat { font-size:11px; color:var(--magpie-muted, GrayText); }
  .genbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0 12px; }
  .spin { display:inline-block; width:11px; height:11px; border:2px solid var(--magpie-line, ButtonBorder);
    border-top-color:var(--magpie-accent, Highlight); border-radius:99px; animation:sp .7s linear infinite; vertical-align:-1px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--magpie-card, ButtonFace);
    border:1px solid var(--magpie-line, ButtonBorder); border-radius:8px; padding:7px 14px; font-size:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.18); display:none; max-width:80vw; word-break:break-all; z-index:9; }
</style>
</head>
<body>
<header>
  <h1>📋 工作日志</h1>
  <span class="chip" id="stat">…</span>
  <span class="spacer"></span>
  <button id="collect">📥 增量采集</button>
</header>

<div class="toolbar">
  <select id="f-days">
    <option value="1">今天</option>
    <option value="3">近 3 天</option>
    <option value="7" selected>近 7 天</option>
    <option value="30">近 30 天</option>
  </select>
  <select id="f-src">
    <option value="" selected>全部来源</option>
    <option value="claude">claude</option>
    <option value="codex">codex</option>
    <option value="omp">omp</option>
    <option value="git">git</option>
  </select>
  <input type="text" id="f-q" placeholder="搜索关键词…" style="width:180px">
  <button id="refresh">🔍 查询</button>
  <span class="stat" id="count"></span>
</div>

<div class="timeline" id="timeline"></div>

<h2>周报生成</h2>
<div class="genbar">
  <label>agent 工具
    <select id="g-runner"></select>
  </label>
  <label>模型
    <select id="g-model"></select>
  </label>
  <label>范围
    <select id="g-days">
      <option value="7" selected>近 7 天</option>
      <option value="14">近 14 天</option>
      <option value="30">近 30 天</option>
    </select>
  </label>
  <button class="primary" id="g-gen">✨ 生成周报</button>
  <button id="g-ctx">👀 看上下文</button>
  <span class="stat" id="g-note"></span>
</div>
<pre id="report"></pre>
<div id="toast"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  function toast(msg, ms = 4200) {
    const el = $("toast");
    el.textContent = msg; el.style.display = "block";
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.style.display = "none"), ms);
  }
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "content-type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await res.json().catch(() => ({ error: "HTTP " + res.status }));
    if (!res.ok) throw new Error(j.error || "HTTP " + res.status);
    return j;
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  try {
    const q = new URLSearchParams(location.search);
    const t = q.get("tokens");
    if (t) {
      const slim = JSON.parse(decodeURIComponent(escape(atob(t))));
      for (const [k, v] of Object.entries(slim || {}))
        document.documentElement.style.setProperty("--magpie-" + k, v);
    }
    if (q.get("theme")) document.documentElement.style.colorScheme = q.get("theme");
  } catch { }

  async function refreshStat() {
    const s = await api("GET", "/api/stats").catch(() => null);
    if (s) $("stat").textContent = `已录 ${s.total} 条 · 跟踪 ${s.trackedFiles} 个文件`;
  }

  async function loadEvents() {
    const days = $("f-days").value;
    const src = $("f-src").value;
    const q = $("f-q").value;
    const since = new Date(Date.now() - days * 86400e3).toISOString();
    const qs = new URLSearchParams({ since, limit: "300" });
    if (src) qs.set("sources", src);
    if (q) qs.set("q", q);
    const evs = await api("GET", "/api/events?" + qs);
    $("count").textContent = `${evs.length} 条`;
    const dayKey = (s) => s.slice(0, 10);
    const html = [];
    let lastDay = "";
    for (const e of evs) {
      const d = dayKey(e.at);
      if (d !== lastDay) { lastDay = d; html.push(`<h2>${d}</h2>`); }
      html.push(`<div class="ev ${e.kind}"><span class="src ${e.source}">${e.source}</span>
        <span class="meta">${e.at.slice(11, 16)} ${e.kind === "prompt" ? "→" : e.kind === "commit" ? "⎇" : "←"} ${esc(e.project || "")}</span>
        <span class="body">${esc(e.text.slice(0, 220))}</span></div>`);
    }
    $("timeline").innerHTML = html.join("") || '<div class="stat">无记录——点右上「增量采集」导入历史会话</div>';
  }

  async function loadRunners() {
    const rs = await api("GET", "/api/runners");
    const sel = $("g-runner");
    sel.innerHTML = "";
    for (const [k, r] of Object.entries(rs)) {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = r.label + (r.available ? "" : "（未安装）");
      if (!r.available) o.disabled = true;
      sel.appendChild(o);
    }
    sel.value = rs.local?.available ? "local" : (Object.keys(rs).find((k) => rs[k].available) || "local");
    sel.onchange = syncModels;
    syncModels();
    function syncModels() {
      const r = rs[sel.value];
      const m = $("g-model");
      m.innerHTML = "";
      for (const x of r?.models || ["—"]) {
        const o = document.createElement("option");
        o.value = x; o.textContent = x;
        m.appendChild(o);
      }
    }
  }

  $("refresh").onclick = () => loadEvents().catch((e) => toast("查询失败: " + e.message));
  $("collect").onclick = async () => {
    const b = $("collect");
    b.disabled = true; b.textContent = "📥 采集中…";
    try {
      const r = await api("POST", "/api/collect", {});
      toast(`采集完成：扫描 ${r.scanned} 个变更文件，新增 ${r.added} 条事件`, 5000);
      await refreshStat(); await loadEvents();
    } catch (e) { toast("采集失败: " + e.message, 6000); }
    finally { b.disabled = false; b.textContent = "📥 增量采集"; }
  };
  $("g-ctx").onclick = async () => {
    const days = Number($("g-days").value);
    const r = await api("POST", "/api/context-preview", { days }).catch((e) => ({ error: e.message }));
    $("report").textContent = r.error ? "错误: " + r.error : `（约 ${r.tokens} tokens）\n\n` + r.text;
  };
  $("g-gen").onclick = async () => {
    const b = $("g-gen");
    b.disabled = true; b.innerHTML = '<span class="spin"></span> 生成中…';
    $("g-note").textContent = "";
    try {
      const r = await api("POST", "/api/generate", {
        days: Number($("g-days").value),
        runner: $("g-runner").value,
        model: $("g-model").value === "—" ? undefined : $("g-model").value,
      });
      if (r.ok) {
        $("report").textContent = r.text;
        $("g-note").textContent = `已存 ${r.file.split("/").pop()} · ${r.events} 事件 + ${r.commits} 提交`;
      } else {
        $("report").textContent = "生成失败: " + (r.error || "?");
      }
    } catch (e) { toast("生成失败: " + e.message, 6000); }
    finally { b.disabled = false; b.textContent = "✨ 生成周报"; }
  };

  (async () => {
    await refreshStat();
    await loadRunners().catch(() => { });
    await loadEvents().catch((e) => toast("加载失败: " + e.message));
    // 自动增量采集（宿主在跑就顺手带上新会话）
    api("POST", "/api/collect", {}).then((r) => { if (r.added) { refreshStat(); loadEvents(); } }).catch(() => { });
  })();
})();
</script>
</body>
</html>
